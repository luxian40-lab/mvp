name: suite nocturna

# No corre en pull requests. 01:00 Bogotá (06:00 UTC). El merge lo frena el checklist de ci.yml.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  suite-completa:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: eki_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DJANGO_SETTINGS_MODULE: mvp_project.settings_test
      SECRET_KEY: ci-not-a-secret
      DJANGO_DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: pytest repo
        run: |
          set +e
          pytest --maxfail=50 -rs --junitxml=pytest-junit-suite.xml . \
            --ignore=scripts \
            --ignore=core/management/commands/test_evaluacion.py \
            | tee pytest-suite.txt
          python scripts/comparar_baseline.py pytest-junit-suite.xml --estricto
      - name: artefacto junit suite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-suite
          path: pytest-junit-suite.xml
          if-no-files-found: warn
