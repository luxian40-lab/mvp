name: ci

on:
  push:
    branches: [main, slice/escalabilidad-base]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: eki_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DJANGO_SETTINGS_MODULE: mvp_project.settings_test
      SECRET_KEY: ci-not-a-secret
      DJANGO_DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: check
        run: python manage.py check
      - name: makemigrations --check
        run: python manage.py makemigrations --check --dry-run
      - name: pytest checklist
        run: |
          set +e
          set -o pipefail
          pytest --maxfail=20 -rs --junitxml=pytest-junit.xml \
            core/tests_ci_baseline.py \
            core/tests_ratchet_complejidad.py \
            core/tests_contrato_arnes.py \
            core/tests_contrato_linea_principal.py \
            core/tests_contrato_linea_2.py \
            core/tests_contrato_dos_lineas.py \
            core/tests_contrato_estados_motor.py \
            core/tests_contexto_motor.py \
            core/tests_estados_legado.py \
            core/tests_seleccion_curso_cadena.py \
            core/tests_marcas.py \
            core/tests_envio_meta_marcas.py \
            core/tests_linea2_curso_directo.py \
            core/tests_confirmando_datos_webhook.py \
            core/tests_examen_modulo_vacio.py \
            core/tests_empleabilidad_pausa.py \
            core/tests_empleabilidad_prueba.py \
            core/tests_medicion_turno.py \
            core/tests_cliente_canal.py \
            core/tests_sender.py \
            core/tests_perfil_linea.py \
            core/tests_turno.py \
            core/tests_linea_bd.py \
            core/tests_webhook_idempotencia.py \
            core/tests_telefono_lock.py \
            core/tests_webhook_fallido.py \
            core/tests_twilio_timeout.py \
            core/tests_infra_p3.py \
            aprende/tests.py \
            aprende/tests_admin.py \
            aprende/tests_aula_rate.py \
            core/tests_module_steps.py \
            core/tests_export_estudiantes.py \
            portal/tests_branding.py \
            | tee pytest-gate.txt
          status=${PIPESTATUS[0]}
          python << 'PY'
          import os
          from pathlib import Path
          lines = Path("pytest-gate.txt").read_text(encoding="utf-8", errors="replace").splitlines()
          malos = [
              ln for ln in lines
              if "carrera requiere Postgres" in ln or "hace falta Redis" in ln
          ]
          resumen = [ln.strip() for ln in lines if "passed" in ln and " in " in ln]
          linea = resumen[-1] if resumen else "sin resumen de pytest"
          print(f"::notice title=pytest -rs::{linea}")
          destino = os.environ.get("GITHUB_STEP_SUMMARY")
          if destino:
              Path(destino).write_text("## pytest checklist\n\n```\n" + linea + "\n```\n", encoding="utf-8")
          for ln in malos:
              print(f"::error::{ln.strip()}")
          if malos:
              raise SystemExit(1)
          PY
          py=$?
          if [ "$py" -ne 0 ]; then exit "$py"; fi
          exit "$status"
      - name: artefacto junit checklist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-checklist
          path: pytest-junit.xml
          if-no-files-found: warn

  suite-completa:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: eki_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DJANGO_SETTINGS_MODULE: mvp_project.settings_test
      SECRET_KEY: ci-not-a-secret
      DJANGO_DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: pytest repo
        run: |
          set +e
          set -o pipefail
          pytest --maxfail=50 -rs --junitxml=pytest-junit-suite.xml . \
            --ignore=scripts \
            --ignore=core/management/commands/test_evaluacion.py \
            | tee pytest-suite.txt
          status=${PIPESTATUS[0]}
          python << 'PY'
          from pathlib import Path
          lines = Path("pytest-suite.txt").read_text(encoding="utf-8", errors="replace").splitlines()
          resumen = [ln.strip() for ln in lines if "passed" in ln and " in " in ln]
          linea = resumen[-1] if resumen else "sin resumen de pytest"
          print(f"::notice title=pytest -rs suite::{linea}")
          PY
          python scripts/comparar_baseline.py pytest-junit-suite.xml
          exit "$status"
      - name: artefacto junit suite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-suite
          path: pytest-junit-suite.xml
          if-no-files-found: warn
