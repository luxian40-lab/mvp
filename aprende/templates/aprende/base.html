<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}eki aprende{% endblock %}</title>
    {% load static %}
    <meta name="theme-color" content="#9A6CAC">
    <link rel="icon" href="{% static 'favicons/aprende.svg' %}" type="image/svg+xml" sizes="any">
    <link rel="icon" href="{% static 'favicons/aprende-32.png' %}" type="image/png" sizes="32x32">
    <link rel="icon" href="{% static 'favicons/aprende.png' %}" type="image/png" sizes="any">
    <link rel="apple-touch-icon" href="{% static 'favicons/aprende-180.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Identidad eki.com.co — Aprende (aula) */
            --eki-purple: #9A6CAC;
            --eki-purple-dark: #7A4E8E;
            --eki-purple-deep: #2A1240;
            --eki-purple-hover: #7A4E8E;
            --eki-purple-soft: #9A6CAC;
            --eki-purple-pale: #F2EBF7;
            --eki-purple-muted: rgba(154, 108, 172, 0.16);
            --eki-blue: #3C7BBF;
            --eki-blue-dark: #2D6099;
            --eki-ink: #2A1240;
            --eki-ink-soft: #4A4A4A;
            --eki-muted: #777777;
            --eki-bg: #F4F2F7;
            --eki-surface: #ffffff;
            --eki-border: rgba(154, 108, 172, 0.18);
            --eki-accent-soft: rgba(255, 255, 255, 0.55);
            --eki-radius: 12px;
            --header-h: 58px;
            --font-serif: "Montserrat", Arial, sans-serif;
            --font-sans: "Montserrat", Arial, sans-serif;
            --font-read: "Montserrat", Arial, sans-serif;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        *, *::before, *::after { box-sizing: border-box; }

        html {
            -webkit-text-size-adjust: 100%;
            overflow-x: clip;
        }

        img, video, iframe { max-width: 100%; }

        @keyframes eki-rise {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes eki-ken {
            from { transform: scale(1.06); }
            to { transform: scale(1); }
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: var(--font-sans);
            font-size: 0.9375rem;
            line-height: 1.55;
            color: var(--eki-ink);
            background:
                radial-gradient(circle at 10% 18%, rgba(154, 108, 172, 0.12) 0%, transparent 34%),
                radial-gradient(circle at 82% -10%, rgba(60, 123, 191, 0.1) 0%, transparent 38%),
                var(--eki-bg);
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            overflow-x: clip;
        }

        /* —— Header (como eki.com.co) —— */
        .eki-header {
            position: sticky;
            top: 0;
            z-index: 100;
            min-height: var(--header-h);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            flex-wrap: wrap;
            padding: 0 max(1rem, env(safe-area-inset-right)) 0 max(1.25rem, env(safe-area-inset-left));
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: none;
        }

        .eki-brand {
            display: flex;
            align-items: baseline;
            gap: 0.65rem;
            text-decoration: none;
            color: var(--eki-ink);
            min-width: 0;
            flex: 1 1 auto;
        }

        .eki-brand-word {
            font-family: var(--font-sans);
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 1;
            text-transform: lowercase;
            color: var(--eki-ink);
        }

        .eki-brand-word em {
            font-style: normal;
            color: var(--eki-purple);
        }

        .eki-brand-text span {
            display: block;
            font-size: 0.58rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--eki-muted);
            margin-top: 2px;
        }

        .eki-nav {
            display: flex;
            align-items: center;
            gap: 0.1rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .eki-nav a {
            color: #111;
            text-decoration: none;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.45rem 0.7rem;
            border-radius: 999px;
            transition: color 0.15s, background 0.15s;
        }

        .eki-nav a:hover {
            color: var(--eki-purple);
            background: var(--eki-purple-pale);
        }

        .eki-nav-toggle {
            display: none;
            background: transparent;
            border: 1px solid var(--eki-border);
            border-radius: var(--eki-radius);
            padding: 0.35rem 0.55rem;
            cursor: pointer;
            color: var(--eki-ink);
            line-height: 1;
        }

        .eki-nav-toggle span {
            display: block;
            width: 18px;
            height: 2px;
            background: currentColor;
            margin: 4px 0;
        }

        /* —— Layout —— */
        .eki-main {
            flex: 1;
            width: 100%;
            max-width: 880px;
            margin: 0 auto;
            padding: 2.25rem 1.5rem 3rem;
            animation: eki-rise 0.55s var(--ease) both;
        }

        .eki-main--wide { max-width: 960px; }

        .eki-main--flush {
            max-width: none;
            padding: 0;
            animation: none;
        }

        .eki-main--flush > .eki-alert {
            max-width: 960px;
            margin: 1rem auto;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }

        /* —— Full-bleed landing hero —— */
        .eki-hero-bleed {
            position: relative;
            min-height: min(88vh, 640px);
            display: flex;
            align-items: center;
            color: #fff;
            overflow: hidden;
            isolation: isolate;
        }

        .eki-hero-bleed__media {
            position: absolute;
            inset: 0;
            z-index: -2;
            background:
                url("https://www.eki.com.co/assets/imageneki.jpg")
                center / cover no-repeat;
            animation: eki-ken 18s var(--ease) both;
            filter: saturate(0.78) brightness(0.95);
        }

        .eki-hero-bleed__shade {
            position: absolute;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(120deg, rgba(5, 10, 25, 0.55) 0%, rgba(5, 10, 25, 0.35) 45%, rgba(42, 18, 64, 0.42) 100%);
        }

        .eki-hero-bleed__inner {
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
            padding: 4rem 1.5rem 3.25rem;
            animation: eki-rise 0.85s var(--ease) 0.1s both;
        }

        .eki-hero-bleed .eki-brand-hero {
            font-family: var(--font-sans);
            font-size: clamp(2.8rem, 10vw, 5.2rem);
            font-weight: 900;
            letter-spacing: -0.05em;
            line-height: 0.92;
            margin: 0 0 1rem;
            text-transform: lowercase;
            color: #fff;
            text-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
        }

        .eki-hero-bleed .eki-brand-hero span {
            color: var(--eki-accent-soft);
        }

        .eki-hero-bleed h1 {
            font-family: var(--font-sans);
            font-size: clamp(1.45rem, 3.5vw, 2.35rem);
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1.08;
            margin: 0 0 0.75rem;
            max-width: 14ch;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
        }

        .eki-hero-bleed h1 em {
            font-style: normal;
            display: block;
            color: rgba(255, 255, 255, 0.52);
        }

        .eki-hero-bleed .eki-lead {
            color: rgba(255, 255, 255, 0.88);
            max-width: 40ch;
            margin: 0 0 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            line-height: 1.65;
        }

        .eki-hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .eki-btn--on-dark {
            background: var(--eki-purple);
            color: #fff;
            border: 2px solid var(--eki-purple);
            box-shadow: 0 10px 24px rgba(154, 108, 172, 0.28);
        }

        .eki-btn--on-dark:hover { background: var(--eki-purple-dark); border-color: var(--eki-purple-dark); }

        .eki-btn--ghost-light {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.7);
            color: #fff;
        }

        .eki-btn--ghost-light:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: #fff;
        }

        .eki-section {
            max-width: 960px;
            margin: 0 auto;
            padding: 3rem 1.5rem 3.5rem;
        }

        h1, h2, h3, .eki-h2 {
            font-family: var(--font-sans);
            font-weight: 800;
            line-height: 1.2;
            color: var(--eki-ink);
            letter-spacing: -0.03em;
        }

        h1 { font-size: clamp(1.45rem, 3vw, 1.75rem); margin: 0 0 0.5rem; }
        h2, .eki-h2 { font-size: 1.0625rem; margin: 0 0 0.75rem; }

        .eki-lead {
            color: var(--eki-muted);
            font-size: 0.9375rem;
            margin: 0 0 1.5rem;
            max-width: 52ch;
            line-height: 1.65;
        }

        .eki-muted { color: var(--eki-muted); font-size: 0.875rem; }

        /* —— Cards —— */
        .eki-card {
            background: var(--eki-surface);
            border: 1px solid var(--eki-border);
            border-radius: var(--eki-radius);
            padding: 1.35rem 1.5rem;
            box-shadow: 0 8px 18px rgba(22, 20, 70, 0.05);
        }

        .eki-card--bar {
            border-left: 4px solid var(--eki-purple);
        }

        .eki-card--interactive {
            display: block;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
        }

        .eki-card--interactive:hover {
            border-color: rgba(154, 108, 172, 0.35);
            box-shadow: 0 14px 28px rgba(42, 18, 64, 0.1);
            transform: translateY(-2px);
        }

        /* —— Buttons —— */
        .eki-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.65rem 1.2rem;
            border-radius: 999px;
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s;
        }

        .eki-btn--primary {
            background: var(--eki-purple);
            color: #fff;
            border: 2px solid var(--eki-purple);
            box-shadow: 0 8px 18px rgba(154, 108, 172, 0.22);
        }

        .eki-btn--primary:hover { background: var(--eki-purple-hover); border-color: var(--eki-purple-hover); }

        .eki-btn--ghost {
            background: #fff;
            color: var(--eki-blue);
            border: 2px solid var(--eki-blue);
        }

        .eki-btn--ghost:hover {
            background: rgba(60, 123, 191, 0.08);
        }

        .eki-btn--sm { padding: 0.38rem 0.7rem; font-size: 0.78rem; }

        /* —— Forms —— */
        .eki-field { margin-bottom: 1rem; }

        .eki-field label {
            display: block;
            font-weight: 600;
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 0.35rem;
            color: var(--eki-ink-soft);
        }

        .eki-field input,
        .eki-field textarea,
        .eki-field select {
            width: 100%;
            padding: 0.55rem 0.75rem;
            border: 1px solid var(--eki-border);
            border-radius: var(--eki-radius);
            font: inherit;
            font-size: 0.9375rem;
            background: #fff;
        }

        .eki-field input:focus,
        .eki-field textarea:focus,
        .eki-field select:focus {
            outline: 2px solid var(--eki-purple-soft);
            outline-offset: 0;
            border-color: var(--eki-purple);
        }

        .eki-field textarea { min-height: 120px; resize: vertical; }

        /* —— Alerts —— */
        .eki-alert {
            padding: 0.7rem 1rem;
            border-radius: var(--eki-radius);
            margin-bottom: 1rem;
            font-size: 0.875rem;
            border: 1px solid;
        }

        .eki-alert--ok {
            background: #f7fdf9;
            border-color: #a7d4b5;
            color: #1e5631;
        }

        .eki-alert--error {
            background: #fdf7f7;
            border-color: #e8b4b4;
            color: #7f1d1d;
        }

        .eki-grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
            gap: 1rem;
        }

        .eki-page-head {
            margin-bottom: 1.75rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--eki-border);
        }

        .eki-badge,
        .eki-kicker {
            display: block;
            font-family: var(--font-sans);
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--eki-purple-dark);
            margin-bottom: 0.45rem;
        }

        /* —— Lists —— */
        .eki-list { list-style: none; padding: 0; margin: 0; }

        .eki-list-item {
            display: flex;
            align-items: flex-start;
            gap: 0.85rem;
            padding: 0.9rem 0;
            border-bottom: 1px solid var(--eki-border);
        }

        .eki-list-item:last-child { border-bottom: none; }

        .eki-list-item a {
            font-family: var(--font-sans);
            color: var(--eki-ink);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.98rem;
        }

        .eki-list-item a:hover { color: var(--eki-purple-dark); text-decoration: underline; }

        .eki-list-num {
            flex-shrink: 0;
            width: 30px;
            height: 30px;
            border-radius: var(--eki-radius);
            border: 1px solid var(--eki-border);
            background: var(--eki-bg);
            color: var(--eki-purple-dark);
            font-weight: 600;
            font-size: 0.78rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eki-list-num--done {
            background: var(--eki-purple-dark);
            border-color: var(--eki-purple-dark);
            color: #fff;
        }

        .eki-progress {
            height: 3px;
            background: var(--eki-border);
            margin-top: 0.65rem;
        }

        .eki-progress-bar {
            height: 100%;
            background: var(--eki-purple);
            width: 0;
            transition: width 0.5s ease;
        }

        /* —— Landing —— */
        .eki-hero {
            padding: 0.25rem 0 2rem;
            max-width: 38rem;
        }

        .eki-hero h1 { font-size: clamp(1.65rem, 3.5vw, 2rem); }

        .eki-role-card {
            padding: 1.5rem;
            position: relative;
        }

        .eki-role-num {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--eki-muted);
            letter-spacing: 0.08em;
        }

        .eki-role-card h2 { font-size: 1.125rem; }
        .eki-role-card p { margin: 0 0 1rem; flex: 1; }

        /* —— Auth —— */
        .eki-auth-split {
            display: grid;
            gap: 1.5rem;
            align-items: start;
        }

        .eki-auth-panel {
            display: none;
            background: linear-gradient(160deg, #9A6CAC 0%, #7A4E8E 100%);
            color: #fff;
            padding: 2rem 1.75rem;
            border-radius: var(--eki-radius);
            border-left: none;
            box-shadow: 0 12px 28px rgba(154, 108, 172, 0.25);
        }
        .eki-auth-panel .eki-trust {
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.12);
            font-size: 0.75rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            opacity: 0.7;
        }
        @media (min-width: 860px) {
            .eki-auth-split {
                grid-template-columns: minmax(240px, 0.9fr) minmax(0, 1.2fr);
                gap: 2rem;
            }
            .eki-auth-panel { display: block; }
        }

        .eki-auth-panel h2 {
            font-family: var(--font-sans);
            color: #fff;
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
        }

        .eki-auth-panel p {
            opacity: 0.9;
            font-size: 0.9375rem;
            margin: 0;
            line-height: 1.65;
        }

        .eki-auth-panel a { color: #fff; text-decoration: underline; text-underline-offset: 2px; }
        .eki-auth-panel a:hover { opacity: 0.9; }

        /* —— Login: marca eki + formulario —— */
        .eki-login-screen {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(300px, 420px);
            min-height: calc(100vh - var(--header-h));
            margin: calc(-2.25rem) -1.5rem -3rem;
            background: var(--eki-bg);
            animation: eki-rise 0.55s var(--ease) both;
        }

        .eki-main--flush .eki-login-screen {
            margin: 0;
            min-height: calc(100vh - var(--header-h));
        }

        .eki-login-visual {
            position: relative;
            overflow: hidden;
            isolation: isolate;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: clamp(2rem, 5vw, 3.5rem);
            color: #fff;
            background: #7A4E8E;
        }

        .eki-login-visual__media {
            position: absolute;
            inset: 0;
            z-index: -2;
            background-size: cover;
            background-position: center;
            animation: eki-ken 18s var(--ease) both;
            filter: saturate(0.8);
        }

        .eki-login-visual__media--estudiante {
            background-image: url("https://www.eki.com.co/assets/imageneki.jpg");
        }

        .eki-login-visual__media--docente {
            background-image: url("https://www.eki.com.co/assets/imageneki.jpg");
        }

        .eki-login-visual__shade {
            position: absolute;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(120deg, rgba(42, 18, 64, 0.78) 0%, rgba(122, 78, 142, 0.55) 50%, rgba(42, 18, 64, 0.35) 100%);
        }

        .eki-login-visual__logo {
            position: relative;
            z-index: 1;
            margin: 0 0 auto;
            font-family: var(--font-sans);
            font-size: clamp(1.45rem, 3vw, 1.8rem);
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 1;
            text-transform: lowercase;
        }

        .eki-login-visual__logo em {
            font-style: normal;
            color: var(--eki-accent-soft);
        }

        .eki-login-visual h2 {
            position: relative;
            z-index: 1;
            font-family: var(--font-sans);
            font-size: clamp(1.4rem, 3.2vw, 2rem);
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1.1;
            color: #fff;
            margin: 0 0 0.75rem;
            max-width: 14ch;
            text-transform: uppercase;
        }

        .eki-login-visual > p {
            position: relative;
            z-index: 1;
            margin: 0;
            color: rgba(255, 255, 255, 0.85);
            max-width: 34ch;
            font-size: 0.95rem;
            line-height: 1.55;
        }

        .eki-login-form {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(1.5rem, 4vw, 2.5rem);
            background: #F9F5FC;
            border-left: 1px solid var(--eki-border);
        }

        .eki-login-card {
            width: 100%;
            max-width: 360px;
        }

        .eki-login-card h1 {
            font-family: var(--font-sans);
            font-size: clamp(1.4rem, 2.2vw, 1.6rem);
            font-weight: 900;
            letter-spacing: -0.03em;
            margin: 0 0 0.4rem;
            color: var(--eki-ink);
        }

        .eki-login-card .eki-muted {
            margin: 0 0 1.4rem;
            color: var(--eki-muted);
            font-size: 0.9rem;
        }

        .eki-login-card .eki-field label {
            color: var(--eki-ink-soft);
        }

        .eki-field-icon {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            background: #fff;
            border-radius: 999px;
            padding: 0 0.9rem;
            min-height: 46px;
            border: 1px solid rgba(154, 108, 172, 0.28);
            transition: box-shadow 0.15s, border-color 0.15s;
        }

        .eki-field-icon:focus-within {
            border-color: var(--eki-purple-soft);
            box-shadow: 0 0 0 3px rgba(154, 108, 172, 0.22);
        }

        .eki-field-icon svg {
            width: 16px;
            height: 16px;
            color: var(--eki-muted);
            flex-shrink: 0;
        }

        .eki-field-icon input {
            flex: 1;
            border: 0;
            outline: none;
            background: transparent;
            font: inherit;
            font-size: 0.92rem;
            color: var(--eki-ink);
            padding: 0.65rem 0;
            min-width: 0;
        }

        .eki-field-icon input::placeholder { color: #a89bb5; }

        .eki-toggle-pass {
            border: 0;
            background: transparent;
            padding: 4px;
            cursor: pointer;
            color: var(--eki-muted);
            display: grid;
            place-items: center;
        }

        .eki-toggle-pass:hover { color: var(--eki-purple-dark); }
        .eki-toggle-pass svg { width: 16px; height: 16px; }

        .eki-login-card .eki-btn--primary {
            width: 100%;
            min-height: 44px;
            margin-top: 0.35rem;
        }

        .eki-login-card__footer {
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px solid var(--eki-border);
            font-size: 0.82rem;
            color: var(--eki-muted);
            text-align: center;
        }

        .eki-login-card__footer a {
            color: var(--eki-purple);
            font-weight: 600;
            text-decoration: none;
        }

        .eki-login-card__footer a:hover { color: var(--eki-purple-dark); text-decoration: underline; }

        @media (max-width: 860px) {
            .eki-login-screen {
                grid-template-columns: 1fr;
                min-height: auto;
            }
            .eki-login-visual {
                min-height: 32vh;
                justify-content: flex-end;
                padding-bottom: 1.75rem;
            }
            .eki-login-visual h2 { max-width: none; font-size: 1.45rem; }
            .eki-login-form {
                border-left: 0;
                border-top: 1px solid var(--eki-border);
                padding: 1.5rem 1.15rem 2rem;
            }
            .eki-login-card { max-width: none; }
        }

        .eki-landing-promise {
            max-width: 36rem;
            margin: 0;
            font-family: var(--font-sans);
            font-size: clamp(1.1rem, 2.2vw, 1.35rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.4;
            color: var(--eki-ink);
        }

        .eki-landing-note {
            margin: 1.5rem 0 0;
            font-size: 0.85rem;
            color: var(--eki-muted);
        }

        .eki-landing-note a {
            color: var(--eki-purple);
            font-weight: 600;
            text-decoration: none;
        }

        .eki-landing-note a:hover { text-decoration: underline; }

        .eki-read-progress {
            position: fixed;
            top: var(--header-h);
            left: 0;
            height: 2px;
            background: var(--eki-purple);
            width: 0;
            z-index: 99;
            transition: width 0.1s linear;
        }

        .eki-article {
            font-family: var(--font-read);
            font-size: 1.0625rem;
            line-height: 1.75;
            white-space: pre-wrap;
            color: var(--eki-ink-soft);
        }

        .eki-video-wrap {
            background: #1a1520;
            aspect-ratio: 16 / 9;
        }

        .eki-video-wrap iframe,
        .eki-video-wrap video {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .eki-material-grid { display: grid; gap: 0.5rem; }

        .eki-material {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 0.85rem;
            border: 1px solid var(--eki-border);
            border-radius: var(--eki-radius);
            text-decoration: none;
            color: inherit;
            transition: border-color 0.15s, background 0.15s;
        }

        .eki-material:hover {
            border-color: var(--eki-purple-soft);
            background: var(--eki-purple-pale);
        }

        .eki-material-tag {
            flex-shrink: 0;
            font-size: 0.62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--eki-purple-dark);
            background: var(--eki-bg);
            border: 1px solid var(--eki-border);
            padding: 0.2rem 0.4rem;
            border-radius: 2px;
            min-width: 2.4rem;
            text-align: center;
        }

        .eki-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .eki-section-title {
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--eki-muted);
            margin: 1.25rem 0 0.65rem;
            padding-top: 0.85rem;
            border-top: 1px solid var(--eki-border);
        }

        .eki-empty {
            text-align: center;
            padding: 2.5rem 1.5rem;
        }

        .eki-footer {
            padding: 1.35rem 1.75rem;
            font-size: 0.78rem;
            color: var(--eki-muted);
            border-top: 1px solid var(--eki-border);
            background: #F4F2F7;
            letter-spacing: 0.02em;
        }
        .eki-footer strong {
            font-family: var(--font-sans);
            font-weight: 800;
            color: var(--eki-purple);
            letter-spacing: -0.02em;
        }

        .eki-tabs {
            display: flex;
            gap: 0.35rem;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--eki-border);
            padding-bottom: 0;
            overflow-x: auto;
            flex-wrap: nowrap;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x proximity;
        }
        .eki-tab {
            padding: 0.55rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--eki-muted);
            text-decoration: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            white-space: nowrap;
            flex-shrink: 0;
            scroll-snap-align: start;
        }
        .eki-tab:hover { color: var(--eki-purple-dark); }
        .eki-tab--active {
            color: var(--eki-purple-dark);
            border-bottom-color: var(--eki-purple);
        }

        .eki-table-wrap { overflow-x: auto; margin: 0.5rem 0; }
        .eki-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }
        .eki-table th {
            text-align: left;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--eki-muted);
            padding: 0.5rem 0.65rem;
            border-bottom: 1px solid var(--eki-border);
        }
        .eki-table td {
            padding: 0.65rem;
            border-bottom: 1px solid var(--eki-border);
            vertical-align: middle;
        }

        .eki-breadcrumb {
            font-size: 0.8rem;
            margin-bottom: 0.65rem;
            color: var(--eki-muted);
        }
        .eki-breadcrumb a {
            color: var(--eki-purple);
            text-decoration: none;
            font-weight: 500;
        }
        .eki-breadcrumb a:hover { text-decoration: underline; }
        .eki-breadcrumb-sep { margin: 0 0.35rem; opacity: 0.6; }

        .eki-btn:focus-visible,
        .eki-nav a:focus-visible,
        .eki-tab:focus-visible,
        .eki-nav-toggle:focus-visible {
            outline: 2px solid var(--eki-purple-soft);
            outline-offset: 2px;
        }

        .eki-file {
            display: block;
            padding: 0.65rem 0.85rem;
            border: 1px dashed var(--eki-border);
            border-radius: var(--eki-radius);
            background: var(--eki-purple-pale);
        }
        .eki-file:focus-within {
            border-color: var(--eki-purple-soft);
            box-shadow: 0 0 0 3px var(--eki-purple-muted);
        }
        .eki-file-name {
            display: block;
            margin-top: 0.35rem;
            font-size: 0.8125rem;
            color: var(--eki-muted);
        }

        @media (max-width: 640px) {
            :root { --header-h: 52px; }

            .eki-brand-text { display: none; }
            .eki-brand-word { font-size: 1.3rem; }

            .eki-nav-toggle {
                display: block;
                flex-shrink: 0;
                min-width: 44px;
                min-height: 44px;
            }

            .eki-nav {
                display: none;
                order: 3;
                flex-basis: 100%;
                flex-direction: column;
                align-items: stretch;
                gap: 0.15rem;
                padding: 0.35rem 0 0.75rem;
                border-top: 1px solid rgba(0, 0, 0, 0.08);
                margin: 0 -0.15rem;
            }
            .eki-nav.is-open { display: flex; }
            .eki-nav a {
                padding: 0.75rem 0.85rem;
                font-size: 0.9rem;
            }

            .eki-main {
                padding: 1.25rem max(1rem, env(safe-area-inset-right)) 2.5rem max(1rem, env(safe-area-inset-left));
            }

            .eki-card { padding: 1.1rem 1rem; }

            .eki-hero-bleed {
                min-height: min(72dvh, 480px);
                align-items: flex-end;
            }
            .eki-hero-bleed .eki-brand-hero {
                font-size: clamp(2.4rem, 14vw, 3.6rem);
                word-break: break-word;
            }
            .eki-hero-bleed__inner {
                padding: 2.5rem max(1rem, env(safe-area-inset-right)) 2rem max(1rem, env(safe-area-inset-left));
            }
            .eki-hero-actions {
                flex-direction: column;
                align-items: stretch;
            }
            .eki-hero-actions .eki-btn {
                width: 100%;
                justify-content: center;
                min-height: 44px;
            }

            .eki-section {
                padding: 2rem max(1rem, env(safe-area-inset-right)) 2.5rem max(1rem, env(safe-area-inset-left));
            }

            .eki-login-screen { min-height: auto; }
            .eki-login-visual {
                min-height: 28vh;
                min-height: 28dvh;
                padding: 1.5rem 1.15rem;
            }
            .eki-login-visual h2 { max-width: none; font-size: 1.4rem; }
            .eki-login-form { padding: 1.35rem 1.1rem 2rem; }
            .eki-login-card { max-width: none; }

            .eki-list-item {
                flex-wrap: wrap;
                gap: 0.65rem;
            }

            .eki-page-head { margin-bottom: 1.25rem; padding-bottom: 1rem; }

            .eki-footer {
                padding: 1rem max(1rem, env(safe-area-inset-right)) calc(1rem + env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
            }

            .eki-media-frame--pdf iframe,
            .eki-media-frame--embed iframe {
                height: min(58vh, 420px);
            }

            .eki-btn { min-height: 42px; }
            .eki-field input,
            .eki-field textarea,
            .eki-field select { font-size: 1rem; } /* evita zoom iOS */
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="eki-read-progress" id="eki-read-progress" hidden></div>

    <header class="eki-header">
        <a href="/aprende/" class="eki-brand">
            <div class="eki-brand-word">eki <em>aprende</em></div>
            <div class="eki-brand-text">
                <span>educación con equidad</span>
            </div>
        </a>
        <button type="button" class="eki-nav-toggle" id="eki-nav-toggle" aria-label="Abrir menú" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <nav class="eki-nav" id="eki-nav">{% block nav %}{% endblock %}</nav>
    </header>

    <main class="eki-main {% block main_class %}{% endblock %}">
        {% if messages %}
            {% for m in messages %}
            <div class="eki-alert eki-alert--{% if 'error' in m.tags %}error{% else %}ok{% endif %}" role="{% if 'error' in m.tags %}alert{% else %}status{% endif %}">{{ m }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <footer class="eki-footer">
        <strong>eki aprende</strong> · educación con equidad para el territorio
    </footer>

    <script>
    (function () {
        var toggle = document.getElementById('eki-nav-toggle');
        var nav = document.getElementById('eki-nav');

        function closeNav() {
            if (nav) nav.classList.remove('is-open');
            if (toggle) toggle.setAttribute('aria-expanded', 'false');
        }

        if (toggle && nav) {
            toggle.addEventListener('click', function (e) {
                e.stopPropagation();
                var open = nav.classList.toggle('is-open');
                toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            });
            document.addEventListener('click', function () { closeNav(); });
            nav.addEventListener('click', function (e) { e.stopPropagation(); });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeNav();
            });
        }

        document.querySelectorAll('form').forEach(function (form) {
            form.addEventListener('submit', function () {
                var btn = form.querySelector('button[type=submit], input[type=submit]');
                if (!btn || btn.disabled) return;
                btn.disabled = true;
                btn.setAttribute('aria-busy', 'true');
                if (btn.tagName === 'BUTTON') {
                    btn.dataset.ekiLabel = btn.textContent;
                    btn.textContent = 'Enviando…';
                }
            });
        });

        document.querySelectorAll('.eki-progress-bar').forEach(function (bar) {
            var w = bar.getAttribute('data-width');
            if (w) requestAnimationFrame(function () { bar.style.width = w + '%'; });
        });

        var readBar = document.getElementById('eki-read-progress');
        var article = document.querySelector('.eki-article');
        if (readBar && article) {
            readBar.hidden = false;
            window.addEventListener('scroll', function () {
                var rect = article.getBoundingClientRect();
                var total = article.offsetHeight - window.innerHeight;
                if (total <= 0) return;
                var scrolled = Math.min(Math.max(-rect.top, 0), total);
                readBar.style.width = (scrolled / total * 100) + '%';
            }, { passive: true });
        }
    })();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
