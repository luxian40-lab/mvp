<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}eki Aprende{% endblock %}</title>
    <style>
        :root { --bg:#f8fafc; --card:#fff; --text:#0f172a; --muted:#64748b; --accent:#2563eb; --border:#e2e8f0; }
        * { box-sizing: border-box; }
        body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
        .wrap { max-width: 960px; margin: 0 auto; padding: 1.25rem; }
        header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:.75rem; }
        header a { color:var(--accent); text-decoration:none; font-weight:500; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.25rem; margin-bottom:1rem; }
        h1 { font-size:1.5rem; margin:0 0 .5rem; }
        h2 { font-size:1.15rem; margin:0 0 .75rem; }
        .muted { color:var(--muted); font-size:.9rem; }
        .btn { display:inline-block; background:var(--accent); color:#fff; padding:.55rem 1rem; border-radius:8px; text-decoration:none; border:none; cursor:pointer; font-size:.95rem; }
        .btn-ghost { background:#fff; color:var(--accent); border:1px solid var(--border); }
        input, textarea, select { width:100%; padding:.5rem .65rem; border:1px solid var(--border); border-radius:8px; margin-bottom:.75rem; font:inherit; }
        label { display:block; font-weight:500; margin-bottom:.25rem; font-size:.9rem; }
        .error { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; padding:.75rem; border-radius:8px; margin-bottom:1rem; }
        .ok { background:#ecfdf5; border:1px solid #a7f3d0; color:#065f46; padding:.75rem; border-radius:8px; margin-bottom:1rem; }
        ul.lecciones { list-style:none; padding:0; margin:0; }
        ul.lecciones li { border-bottom:1px solid var(--border); padding:.75rem 0; }
        ul.lecciones li:last-child { border:none; }
        ul.lecciones a { color:var(--text); text-decoration:none; font-weight:500; }
        ul.lecciones a:hover { color:var(--accent); }
        .contenido { white-space:pre-wrap; }
        iframe, video { max-width:100%; border-radius:8px; margin:1rem 0; }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <div><strong>eki</strong> Aprende</div>
        <nav>{% block nav %}{% endblock %}</nav>
    </header>
    {% if messages %}
        {% for m in messages %}<div class="ok">{{ m }}</div>{% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
