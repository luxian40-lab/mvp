{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1F2933">
    <title>{% block title %}eki · calculadora de costos y margen{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'calculadora_margen/calculadora.css' %}?v=3">
    {% block extra_head %}{% endblock %}
</head>
<body class="cm-body">
    <header class="cm-header">
        <a href="{% if request.get_host == 'margen.eki.technology' %}/{% else %}/calculadora-margen/{% endif %}" class="cm-header__brand" aria-label="eki — inicio">
            <img src="{% static 'calculadora_margen/eki-logo.png' %}" alt="eki" class="cm-header__logo" width="120" height="44">
        </a>
    </header>
    {% block body %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
