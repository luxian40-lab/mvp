<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | eki</title>
    {% include 'portal/partials/favicon_co.html' %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        (function () {
            var t = localStorage.getItem('eki-portal-theme');
            if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        :root {
            --ink: #0c1222;
            --fondo: #f3f4f2;
            --texto: #12141a;
            --muted: #5c6570;
            --borde: #e4e6e2;
            --accent: #0f6e6a;
            --accent-hover: #0a5552;
            --font: 'Sora', system-ui, sans-serif;
            --display: 'Fraunces', Georgia, serif;
        }
        html[data-theme="dark"] {
            --fondo: #080c14;
            --texto: #e8ecef;
            --muted: #8b95a5;
            --borde: #2a3344;
            --accent: #3d9e99;
            --accent-hover: #5a9e9a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(320px, 440px);
            font-family: var(--font);
            color: var(--texto);
            background: var(--fondo);
        }
        @media (max-width: 840px) {
            body { grid-template-columns: 1fr; }
            .login-hero { min-height: 28vh; }
        }
        .login-hero {
            position: relative;
            background:
                radial-gradient(ellipse 80% 60% at 20% 30%, rgba(15, 110, 106, 0.35), transparent 55%),
                radial-gradient(ellipse 70% 50% at 80% 70%, rgba(12, 18, 34, 0.5), transparent 50%),
                var(--ink);
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: clamp(2rem, 5vw, 3.5rem);
            overflow: hidden;
        }
        .login-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            pointer-events: none;
        }
        .login-hero-inner { position: relative; z-index: 1; max-width: 28rem; }
        .login-hero .brand {
            font-family: var(--display);
            font-size: clamp(3.5rem, 8vw, 5.5rem);
            font-weight: 650;
            letter-spacing: -0.04em;
            line-height: 0.95;
            margin: 0 0 1rem;
        }
        .login-hero p {
            margin: 0;
            font-size: 1.05rem;
            line-height: 1.5;
            color: rgba(241, 245, 249, 0.78);
            max-width: 22rem;
        }
        .login-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: clamp(1.5rem, 4vw, 3rem);
            background: var(--fondo);
            position: relative;
        }
        .theme-btn {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            width: 36px;
            height: 36px;
            border: 1px solid var(--borde);
            border-radius: 8px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font-size: 14px;
        }
        .login-panel h1 {
            font-family: var(--display);
            font-size: 1.65rem;
            font-weight: 560;
            letter-spacing: -0.02em;
            margin: 0 0 0.35rem;
        }
        .login-panel .sub {
            margin: 0 0 1.75rem;
            color: var(--muted);
            font-size: 0.9rem;
        }
        label {
            display: block;
            margin: 16px 0 6px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
        }
        input {
            width: 100%;
            border: 1px solid var(--borde);
            border-radius: 8px;
            font: inherit;
            font-size: 15px;
            padding: 12px 14px;
            outline: none;
            background: #fff;
            color: var(--texto);
        }
        html[data-theme="dark"] input { background: #121826; }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(15, 110, 106, 0.18);
        }
        button[type="submit"] {
            width: 100%;
            margin-top: 1.5rem;
            border: 0;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
            font-size: 14px;
            padding: 13px;
        }
        button[type="submit"]:hover { background: var(--accent-hover); }
        .error {
            margin-bottom: 16px;
            border-radius: 8px;
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 11px 12px;
            font-size: 13px;
        }
        html[data-theme="dark"] .error {
            background: #450a0a;
            border-color: #991b1b;
            color: #fecaca;
        }
        .footer-note {
            margin-top: 1.75rem;
            font-size: 12px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <aside class="login-hero" aria-hidden="false">
        <div class="login-hero-inner">
            <p class="brand">eki</p>
            <p>Portal para organizaciones. Métricas, retención y operación en un solo lugar.</p>
        </div>
    </aside>
    <main class="login-panel">
        <button type="button" class="theme-btn" id="login-theme" title="Modo claro / oscuro" aria-label="Cambiar tema">◐</button>
        <h1>Ingresar</h1>
        <p class="sub">Acceso para equipos cliente</p>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label for="username">Usuario</label>
            <input id="username" type="text" name="username" autocomplete="username" required>
            <label for="password">Contraseña</label>
            <input id="password" type="password" name="password" autocomplete="current-password" required>
            <button type="submit">Continuar</button>
        </form>
        <p class="footer-note">¿Problemas de acceso? Contacte a su administrador eki.</p>
    </main>
    <script>
        document.getElementById('login-theme').addEventListener('click', function () {
            var dark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (dark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('eki-portal-theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('eki-portal-theme', 'dark');
            }
        });
    </script>
</body>
</html>
