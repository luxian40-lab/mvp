<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | eki portal</title>
    {% include 'portal/partials/favicon_co.html' %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650;9..144,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        (function () {
            var t = localStorage.getItem('eki-portal-theme');
            if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        :root {
            --ink: #0b1c1b;
            --fondo: #e8eeec;
            --surface: #f7faf9;
            --texto: #121816;
            --muted: #5a6b66;
            --borde: rgba(11, 28, 27, 0.12);
            --accent: #0f6e6a;
            --accent-hover: #0a5552;
            --font: 'Sora', system-ui, sans-serif;
            --display: 'Fraunces', Georgia, serif;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }
        html[data-theme="dark"] {
            --fondo: #071412;
            --surface: #0e1f1d;
            --texto: #e8f0ee;
            --muted: #8aa39c;
            --borde: rgba(232, 240, 238, 0.12);
            --accent: #3d9e99;
            --accent-hover: #5ab5b0;
        }
        * { box-sizing: border-box; }
        @keyframes portal-rise {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes portal-ken {
            from { transform: scale(1.06); }
            to { transform: scale(1); }
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(320px, 440px);
            font-family: var(--font);
            color: var(--texto);
            background: var(--fondo);
        }
        @media (max-width: 840px) {
            body { grid-template-columns: 1fr; }
            .login-hero { min-height: 38vh; }
        }
        .login-hero {
            position: relative;
            color: #f1f8f6;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: clamp(2rem, 5vw, 3.5rem);
            overflow: hidden;
            isolation: isolate;
        }
        .login-hero__media {
            position: absolute;
            inset: 0;
            z-index: -2;
            background:
                url("https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1800&q=80")
                center / cover no-repeat;
            animation: portal-ken 20s var(--ease) both;
        }
        .login-hero__shade {
            position: absolute;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(115deg, rgba(11, 28, 27, 0.92) 0%, rgba(15, 110, 106, 0.55) 55%, rgba(11, 28, 27, 0.35) 100%),
                linear-gradient(0deg, rgba(11, 28, 27, 0.8) 0%, transparent 50%);
        }
        .login-hero-inner {
            position: relative;
            z-index: 1;
            max-width: 28rem;
            animation: portal-rise 0.85s var(--ease) 0.08s both;
        }
        .login-hero .brand {
            font-family: var(--display);
            font-size: clamp(3.2rem, 9vw, 5.75rem);
            font-weight: 700;
            letter-spacing: -0.045em;
            line-height: 0.92;
            margin: 0 0 1rem;
            text-transform: lowercase;
        }
        .login-hero .brand em {
            font-style: normal;
            color: #5eead4;
        }
        .login-hero p {
            margin: 0;
            font-size: 1.05rem;
            line-height: 1.55;
            color: rgba(241, 248, 246, 0.82);
            max-width: 26rem;
        }
        .login-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: clamp(1.5rem, 4vw, 3rem);
            background: var(--surface);
            position: relative;
            border-left: 1px solid var(--borde);
            animation: portal-rise 0.7s var(--ease) 0.15s both;
        }
        .theme-btn {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            width: 36px;
            height: 36px;
            border: 1px solid var(--borde);
            border-radius: 6px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font-size: 14px;
        }
        .login-panel h1 {
            font-family: var(--display);
            font-size: 1.75rem;
            font-weight: 650;
            letter-spacing: -0.03em;
            margin: 0 0 0.35rem;
        }
        .login-panel .sub {
            margin: 0 0 1.75rem;
            color: var(--muted);
            font-size: 0.9rem;
        }
        label {
            display: block;
            margin: 16px 0 6px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
        }
        input {
            width: 100%;
            border: 1px solid var(--borde);
            border-radius: 6px;
            font: inherit;
            font-size: 15px;
            padding: 12px 14px;
            outline: none;
            background: #fff;
            color: var(--texto);
        }
        html[data-theme="dark"] input { background: #0a1816; }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(15, 110, 106, 0.18);
        }
        button[type="submit"] {
            width: 100%;
            margin-top: 1.5rem;
            border: 0;
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
            font-size: 14px;
            padding: 13px;
            transition: background 0.15s;
        }
        button[type="submit"]:hover { background: var(--accent-hover); }
        .error {
            margin-bottom: 16px;
            border-radius: 6px;
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 11px 12px;
            font-size: 13px;
        }
        html[data-theme="dark"] .error {
            background: #450a0a;
            border-color: #991b1b;
            color: #fecaca;
        }
        .footer-note {
            margin-top: 1.75rem;
            font-size: 12px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <aside class="login-hero" aria-label="eki portal">
        <div class="login-hero__media" role="img" aria-label="Espacio de trabajo de equipo"></div>
        <div class="login-hero__shade"></div>
        <div class="login-hero-inner">
            <p class="brand">eki <em>portal</em></p>
            <p>Métricas, retención y operación para tu organización — en un solo lugar.</p>
        </div>
    </aside>
    <main class="login-panel">
        <button type="button" class="theme-btn" id="login-theme" title="Modo claro / oscuro" aria-label="Cambiar tema">◐</button>
        <h1>Ingresar</h1>
        <p class="sub">Acceso para equipos cliente</p>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label for="username">Usuario</label>
            <input id="username" type="text" name="username" autocomplete="username" required>
            <label for="password">Contraseña</label>
            <input id="password" type="password" name="password" autocomplete="current-password" required>
            <button type="submit">Continuar</button>
        </form>
        <p class="footer-note">¿Problemas de acceso? Contacte a su administrador eki.</p>
    </main>
    <script>
        document.getElementById('login-theme').addEventListener('click', function () {
            var dark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (dark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('eki-portal-theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('eki-portal-theme', 'dark');
            }
        });
    </script>
</body>
</html>
