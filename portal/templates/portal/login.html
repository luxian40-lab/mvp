<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Portal eki</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        (function () {
            var t = localStorage.getItem('eki-portal-theme');
            if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        :root {
            --fondo: #f1f5f9;
            --card: #fff;
            --texto: #0f172a;
            --muted: #64748b;
            --borde: #e2e8f0;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
        }
        html[data-theme="dark"] {
            --fondo: #0b1220;
            --card: #1e293b;
            --texto: #e2e8f0;
            --muted: #94a3b8;
            --borde: #334155;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--fondo);
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--texto);
        }
        .login-wrap { width: min(400px, calc(100% - 32px)); }
        .login-top {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .theme-btn {
            width: 34px;
            height: 34px;
            border: 1px solid var(--borde);
            border-radius: 8px;
            background: var(--card);
            color: var(--muted);
            cursor: pointer;
            font-size: 14px;
        }
        .login-card {
            background: var(--card);
            border: 1px solid var(--borde);
            border-radius: 12px;
            padding: 36px 32px;
            box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
        }
        html[data-theme="dark"] .login-card {
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }
        .brand-eki { text-align: center; margin-bottom: 28px; }
        .brand-eki span {
            display: inline-block;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .brand-eki strong {
            display: block;
            margin-top: 6px;
            font-size: 22px;
            font-weight: 700;
            color: var(--texto);
        }
        label {
            display: block;
            margin: 16px 0 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
        }
        input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--borde);
            border-radius: 8px;
            font: inherit;
            font-size: 14px;
            padding: 11px 12px;
            outline: none;
            background: var(--card);
            color: var(--texto);
        }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        button[type="submit"] {
            width: 100%;
            margin-top: 22px;
            border: 0;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
            font-size: 14px;
            padding: 12px;
        }
        button[type="submit"]:hover { background: var(--accent-hover); }
        .error {
            margin-bottom: 16px;
            border-radius: 8px;
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 11px 12px;
            font-size: 13px;
        }
        html[data-theme="dark"] .error {
            background: #450a0a;
            border-color: #991b1b;
            color: #fecaca;
        }
        .footer-note {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-top">
            <button type="button" class="theme-btn" id="login-theme" title="Modo claro / oscuro" aria-label="Cambiar tema">◐</button>
        </div>
        <section class="login-card">
            <div class="brand-eki">
                <span>Plataforma</span>
                <strong>eki</strong>
            </div>
            <p style="text-align:center;color:var(--muted);font-size:13px;margin:-12px 0 20px;">
                Acceso para organizaciones cliente
            </p>
            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <label for="username">Usuario</label>
                <input id="username" type="text" name="username" autocomplete="username" required>
                <label for="password">Contraseña</label>
                <input id="password" type="password" name="password" autocomplete="current-password" required>
                <button type="submit">Ingresar</button>
            </form>
        </section>
        <p class="footer-note">¿Problemas de acceso? Contacte a su administrador eki.</p>
    </div>
    <script>
        document.getElementById('login-theme').addEventListener('click', function () {
            var dark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (dark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('eki-portal-theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('eki-portal-theme', 'dark');
            }
        });
    </script>
</body>
</html>
