{# Estilos Centro de Éxito — portal y admin (variables con fallback) #}
<style>

}
.centro-exito .ret-student__name { font-weight: 700; color: var(--ce-text); }
.centro-exito .ret-student__meta { font-size: 12px; color: var(--ce-muted); }
.centro-exito .ret-student__why { margin: 8px 0 0; padding-left: 1.1rem; font-size: 13px; color: var(--ce-text); }

.centro-exito .ret-curve {

.centro-exito .ret-auto__arrow { color: var(--ce-muted); font-weight: 700; text-align: center; }

}

    border: 1px solid var(--ce-borde); font: inherit; background: #fff; color: var(--ce-text);
}
.centro-exito .ret-agent__chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.centro-exito .ret-agent__chip {

.centro-exito .ret-two { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; }

.centro-exito .ret-wa dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 13px; }
