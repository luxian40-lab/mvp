<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suscripción vencida | eki</title>
    {% include 'portal/partials/favicon_co.html' %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            color: #333333;
            font-family: 'Montserrat', Arial, sans-serif;
            text-align: center;
        }

        .card {
            width: min(520px, calc(100% - 32px));
            background: #ffffff;
            border-radius: 22px;
            padding: 42px;
            box-shadow: 0 18px 40px rgba(39, 24, 47, 0.08);
        }

        .logo {
            margin: 0 0 18px;
            color: #9A6CAC;
            font-size: 54px;
            font-weight: 700;
            letter-spacing: -3px;
        }

        .btn {
            display: inline-block;
            margin: 18px 8px 0;
            border-radius: 14px;
            background: #9A6CAC;
            color: #ffffff;
            font-weight: 700;
            padding: 13px 18px;
            text-decoration: none;
        }

        .btn.secondary { background: #3C7BBF; }
    </style>
</head>
<body>
    <section class="card">
        <h1 class="logo">eki</h1>
        <h2>Tu suscripción ha vencido</h2>
        <p>Para renovar tu acceso contacta al equipo eki.</p>
        {% if whatsapp_soporte %}
            <a class="btn" href="https://wa.me/{{ whatsapp_soporte }}?text={{ 'Hola equipo eki, quiero renovar mi suscripción.'|urlencode }}" target="_blank" rel="noopener">Contactar por WhatsApp</a>
        {% endif %}
        <a class="btn secondary" href="/portal/logout/">Cerrar sesión</a>
    </section>
</body>
</html>
