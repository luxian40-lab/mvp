[pytest]
DJANGO_SETTINGS_MODULE = mvp_project.settings_test
python_files = tests.py test_*.py tests_*.py
testpaths = core formulario
norecursedirs = temp_deploy_v4 .git .venv venv node_modules
addopts = -q --tb=short -rs --disable-socket --allow-hosts=127.0.0.1,localhost,::1 --ignore=core/management/commands/test_evaluacion.py
