{% extends "studio/base.html" %}
{% block title %}Registro creador | eki Studio{% endblock %}
{% block content %}
<div class="st-login-wrap">
    <div class="st-card st-login-card st-card--neon">
        <span class="st-kicker st-kicker--neon">Creador</span>
        <h1 style="font-size:1.4rem;">Solicitar espacio de creador</h1>
        <p class="st-muted" style="margin-bottom:1.25rem;">Cuenta con correo. eki activa tu perfil para publicar y cobrar.</p>
        {% if error %}<div class="st-alert st-alert--error">{{ error }}</div>{% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="st-field">
                <label for="nombre_publico">Nombre público / marca</label>
                <input id="nombre_publico" name="nombre_publico" required>
            </div>
            <div class="st-field">
                <label for="email">Correo</label>
                <input id="email" name="email" type="email" required>
            </div>
            <div class="st-field">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" required minlength="8">
            </div>
            <div class="st-field">
                <label for="bio">Cuéntanos tu propuesta (opcional)</label>
                <textarea id="bio" name="bio" rows="3" style="width:100%;padding:0.6rem;border:1px solid var(--st-border);border-radius:var(--st-radius-sm);background:rgba(0,0,0,0.2);color:var(--st-ink);font:inherit;"></textarea>
            </div>
            <button type="submit" class="st-btn st-btn--neon st-btn--block">Enviar solicitud</button>
        </form>
    </div>
</div>
{% endblock %}
