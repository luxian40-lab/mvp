{% extends "studio/base.html" %}
{% block title %}Registro creador | eki Studio{% endblock %}
{% block content %}
<div class="st-login-wrap">
    <div class="st-panel">
        <h1 style="font-family:var(--font-display);font-size:1.5rem;letter-spacing:-0.03em;margin:0 0 0.35rem;">Espacio de creador</h1>
        <p class="st-muted" style="margin-bottom:1.25rem;">Cuenta con correo. eki activa tu perfil para publicar y cobrar.</p>
        {% if error %}<div class="st-alert st-alert--error">{{ error }}</div>{% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="st-field">
                <label for="nombre_publico">Nombre público / marca</label>
                <input id="nombre_publico" name="nombre_publico" required>
            </div>
            <div class="st-field">
                <label for="email">Correo</label>
                <input id="email" name="email" type="email" required>
            </div>
            <div class="st-field">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" required minlength="8">
            </div>
            <div class="st-field">
                <label for="bio">Cuéntanos tu propuesta (opcional)</label>
                <textarea id="bio" name="bio" rows="3"></textarea>
            </div>
            <button type="submit" class="st-btn st-btn--primary st-btn--block">Enviar solicitud</button>
        </form>
    </div>
</div>
{% endblock %}
