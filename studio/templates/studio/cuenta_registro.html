{% extends "studio/base.html" %}
{% block title %}Crear cuenta | eki Studio{% endblock %}
{% block content %}
<div class="st-login-wrap">
    <div class="st-panel">
        <h1 style="font-family:var(--font-display);font-size:1.65rem;letter-spacing:-0.03em;margin:0 0 0.35rem;">Únete a Studio</h1>
        <p class="st-muted" style="margin-bottom:1.25rem;">Correo y contraseña. Estudia en Aprende con la misma cuenta.</p>
        {% if error %}<div class="st-alert st-alert--error">{{ error }}</div>{% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="st-field">
                <label for="nombre">Nombre completo</label>
                <input id="nombre" name="nombre" type="text" required autocomplete="name">
            </div>
            <div class="st-field">
                <label for="email">Correo electrónico</label>
                <input id="email" name="email" type="email" required autocomplete="email">
            </div>
            <div class="st-field">
                <label for="password">Contraseña (mín. 8 caracteres)</label>
                <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
            </div>
            <button type="submit" class="st-btn st-btn--primary st-btn--block">Crear cuenta</button>
        </form>
        <p class="st-muted" style="margin-top:1rem;text-align:center;">
            ¿Ya tienes cuenta? <a href="{% url 'studio_cuenta_login' %}" style="color:var(--st-ink);font-weight:700;">Ingresar</a>
        </p>
    </div>
</div>
{% endblock %}
