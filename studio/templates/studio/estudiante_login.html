{% extends "studio/base.html" %}
{% block title %}Ingresar | eki Studio{% endblock %}
{% block content %}
<div class="st-card" style="max-width:400px;margin:0 auto;">
    <h1 style="font-size:1.25rem;">Ingresar</h1>
    <p class="st-muted">Misma cuenta que WhatsApp y el aula virtual.</p>
    {% if error %}
    <div class="st-alert st-alert--error">{{ error }}</div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="st-field">
            <label for="cedula">Cédula</label>
            <input id="cedula" name="cedula" type="text" required autocomplete="username">
        </div>
        <div class="st-field">
            <label for="telefono">Teléfono WhatsApp</label>
            <input id="telefono" name="telefono" type="tel" required autocomplete="tel">
        </div>
        <button type="submit" class="st-btn st-btn--primary">Continuar</button>
    </form>
</div>
{% endblock %}
