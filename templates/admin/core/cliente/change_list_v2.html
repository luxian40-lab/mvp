{% extends "admin/change_list.html" %}

{% block extrahead %}
{{ block.super }}
<script>
document.addEventListener('DOMContentLoaded', function () {
    var cambios = {
        'Filters': 'Filtros',
        'Apply Filters': 'Aplicar filtros',
        'Clear all filters': 'Quitar filtros',
        'Select action': 'Elegir acción',
        'Type to search': 'Buscar',
        'General': 'Ficha'
    };
    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    var nodo;
    while ((nodo = walker.nextNode())) {
        var limpio = nodo.nodeValue.trim();
        if (cambios[limpio]) nodo.nodeValue = nodo.nodeValue.replace(limpio, cambios[limpio]);
    }
});
</script>
{% endblock %}
