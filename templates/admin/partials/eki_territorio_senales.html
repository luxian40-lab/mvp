{% load static %}
<section class="eki-territorio" aria-label="Territorio y señales">
  <h2>Territorio y señales</h2>
  <p class="eki-territorio__stat" id="mapa-panel-stats">
    Todos los clientes · Depts
    <strong id="mapa-stat-depts">—/32</strong>
    · Municipios
    <strong id="mapa-stat-munis">—</strong>
    · En mapa
    <strong id="mapa-stat-mapped">—</strong>
    <span id="mapa-stat-fresh"></span>
  </p>
  <div id="mapa-panel-inicio" class="eki-panel-map__canvas" aria-label="Mapa Colombia — todos los estudiantes"></div>
  <p id="mapa-panel-inicio-msg" hidden></p>
  <p><a href="{% url 'admin_cobertura_mapa' %}">Abrir cobertura</a>
    · <a href="{% url 'admin_territorio_alertas' %}">Alertas territoriales</a>
    · <a href="{% url 'ai_ops_eventos' %}">Actividad reciente</a></p>
</section>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
function ekiBootMapaTerritorio() {
  if (typeof L === 'undefined') return;
  var el = document.getElementById('mapa-panel-inicio');
  if (!el || el.dataset.listo === '1') return;
  el.dataset.listo = '1';
  function colorMuni(cantidad, maxCant) {
    if (!maxCant || !cantidad) return '#f1f5f9';
    var t = Math.min(1, cantidad / maxCant);
    return 'rgb(' + Math.round(243 + (155 - 243) * t) + ',' +
      Math.round(234 + (103 - 234) * t) + ',' +
      Math.round(247 + (177 - 247) * t) + ')';
  }
  var map = L.map(el, { scrollWheelZoom: false }).setView([4.57, -74.29], 5.5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 12,
    attribution: '&copy; OSM'
  }).addTo(map);
  Promise.all([
    fetch('/admin/cobertura/datos.json?global=1', { credentials: 'same-origin' }).then(function (r) { return r.json(); }),
    fetch('/admin/cobertura/municipios.geojson', { credentials: 'same-origin' }).then(function (r) { return r.json(); })
  ]).then(function (res) {
    var datos = res[0], geo = res[1];
    var porMuni = datos.por_municipio_clave || {};
    var maxM = datos.max_municipio || 0;
    var deptsEl = document.getElementById('mapa-stat-depts');
    var munisEl = document.getElementById('mapa-stat-munis');
    var mappedEl = document.getElementById('mapa-stat-mapped');
    var freshEl = document.getElementById('mapa-stat-fresh');
    if (deptsEl) deptsEl.textContent = (datos.departamentos_distintos || 0) + '/32';
    if (munisEl) munisEl.textContent = String(datos.municipios_distintos || 0);
    if (mappedEl) mappedEl.textContent = String(datos.con_municipio_mapeado || 0);
    if (freshEl) freshEl.textContent = ' · actualizado ahora';
    var layer = L.geoJSON(geo, {
      style: function (f) {
        var n = porMuni[f.properties.CLAVE] || 0;
        return { fillColor: colorMuni(n, maxM), weight: 0.4, color: '#cbd5e1', fillOpacity: n ? 0.9 : 0.15 };
      }
    }).addTo(map);
    try { map.fitBounds(layer.getBounds(), { padding: [16, 16], maxZoom: 6 }); }
    catch (e) { map.setView([4.57, -74.29], 5.5); }
    setTimeout(function () { map.invalidateSize(); }, 150);
  }).catch(function () {
    var msg = document.getElementById('mapa-panel-inicio-msg');
    if (!msg) return;
    msg.hidden = false;
    msg.textContent = 'No se pudo cargar el mapa de cobertura.';
  });
}
</script>
