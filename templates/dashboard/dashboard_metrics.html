{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Dashboard Ejecutivo - KPIs Generales</h2>
  <div class="row mb-4">
    <div class="col-md-3">
      <div class="card text-center">
        <div class="card-body">
          <h5 class="card-title">Total Estudiantes</h5>
          <p class="display-4">{{ total_estudiantes }}</p>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-center">
        <div class="card-body">
          <h5 class="card-title">Activos</h5>
          <p class="display-4">{{ activos }}</p>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-center">
        <div class="card-body">
          <h5 class="card-title">Completados</h5>
          <p class="display-4">{{ completados }}</p>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-center">
        <div class="card-body">
          <h5 class="card-title">Total Logs WhatsApp</h5>
          <p class="display-4">{{ total_logs }}</p>
        </div>
      </div>
    </div>
  </div>
  <form method="get" class="mb-4">
    <div class="row">
      <div class="col-md-4">
        <label>Fecha inicio:</label>
        <input type="date" name="fecha_inicio" value="{{ fecha_inicio|date:'Y-m-d' }}" class="form-control">
      </div>
      <div class="col-md-4">
        <label>Fecha fin:</label>
        <input type="date" name="fecha_fin" value="{{ fecha_fin|date:'Y-m-d' }}" class="form-control">
      </div>
      <div class="col-md-4">
        <label>Cliente:</label>
        <input type="text" name="cliente" value="{{ cliente_id }}" class="form-control">
      </div>
    </div>
    <button type="submit" class="btn btn-primary mt-3">Filtrar</button>
  </form>
</div>
{% endblock %}
